version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: forecastiq_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forecastiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forecastiq_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forecastiq_backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 9000
      "
    networks:
      - forecastiq_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forecastiq_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:9000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - forecastiq_network

volumes:
  postgres_data:

networks:
  forecastiq_network:
    driver: bridge